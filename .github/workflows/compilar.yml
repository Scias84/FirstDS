name: Compilar APK Emulator NDK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      # 🛠️ ESTO ES LO QUE FALTABA: Instala NDK y CMake para compilar el C++
      - name: Instalar NDK y CMake obligatorios para C++
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug con motor nativo
        run: ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
